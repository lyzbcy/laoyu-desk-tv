name: Desktop validation and builds
on:
  push:
    branches: ['master', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      transfer_run:
        description: Transfer exact successful native build artifacts into an existing draft
        default: ''
      installed_update:
        description: Verify actual installed Windows update in temporary VM
        type: boolean
        default: false
      recovery_test:
        description: Inject one post-install failure into a copied immutable helper on hosted Windows
        type: boolean
        default: false
      center_product:
        description: Verify immutable official software center fresh download, preparation and reopen
        type: boolean
        default: false
      old_version:
        description: Exact immutable installed baseline
        default: '0.3.3'
      new_version:
        description: Exact immutable update target
        default: '0.3.12'
      metadata_fixture:
        description: Explicit candidate metadata fixture, never formal online discovery
        type: boolean
        default: false
      desktop_shortcut:
        description: Preserve installed baseline desktop shortcut choice
        type: boolean
        default: true
      upload_mac_draft:
        description: Upload verified Mac packages to an existing draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  desktop:
    if: ${{ !inputs.installed_update && !inputs.recovery_test && !inputs.center_product && inputs.transfer_run == '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Isolated real Electron UI regression
        shell: bash
        env:
          PAID_SMOKE_OUTPUT: verification/ui
        run: node_modules/.bin/electron . --paid-to-watch-smoke --disable-gpu --no-sandbox
      - name: Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac Intel and Apple Silicon packages
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Packaged native Mac UI regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          PAID_SMOKE_OUTPUT: verification/ui-packaged
        run: |
          binary=$(find dist/mac-arm64 -path '*/Contents/MacOS/*' -type f -maxdepth 4 | head -n 1)
          "$binary" --paid-to-watch-smoke --disable-gpu --no-sandbox
      - name: Upload Mac packages to prepared draft
        if: runner.os == 'macOS' && inputs.upload_mac_draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$(gh release view "v$version" --json isDraft --jq '.isDraft')" = true
          gh release upload "v$version" dist/*.dmg dist/*mac*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: laoyu-desk-tv-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.yml
            verification/ui/*
            verification/ui-packaged/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-evidence-${{ runner.os }}
          path: verification/ui*/*
  production-update:
    if: ${{ inputs.installed_update }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Actual installed update, native window and desktop reopen
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_OLD_VERSION: ${{ inputs.old_version }}
          DESK_NEW_VERSION: ${{ inputs.new_version }}
          DESK_METADATA_FIXTURE: ${{ inputs.metadata_fixture }}
          DESK_DESKTOP: ${{ inputs.desktop_shortcut }}
        run: node scripts/ci-installed-update.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-update-${{ inputs.old_version }}-to-${{ inputs.new_version }}
          path: verification/installed-*/**
  draft-transfer:
    if: ${{ inputs.transfer_run != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Transfer and hash exact native build assets, draft only
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_TRANSFER_RUN: ${{ inputs.transfer_run }}
        run: node scripts/ci-transfer-draft.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-receipt
          path: verification/transfer-*/transfer.json
  installed-recovery:
    if: ${{ inputs.recovery_test }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Real NSIS replacement and copied-helper failure recovery
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_OLD_VERSION: ${{ inputs.old_version }}
          DESK_NEW_VERSION: ${{ inputs.new_version }}
        run: node scripts/ci-installed-recovery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-recovery-${{ inputs.old_version }}-to-${{ inputs.new_version }}
          path: verification/recovery-*/**
  center-product:
    if: ${{ inputs.center_product }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
      - name: Exact official center downloads current product despite old cache
        env:
          GH_TOKEN: ${{ github.token }}
          DESK_NEW_VERSION: ${{ inputs.new_version }}
        run: node scripts/ci-center-product.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: center-product-${{ inputs.new_version }}
          path: verification/center-product/**
