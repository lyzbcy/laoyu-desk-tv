name: Desktop validation and builds
on:
  push:
    branches: ['master', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_mac_draft:
        description: Upload verified Mac packages to an existing draft release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Isolated real Electron UI regression
        shell: bash
        env:
          PAID_SMOKE_OUTPUT: verification/ui
        run: node_modules/.bin/electron . --paid-to-watch-smoke --disable-gpu --no-sandbox
      - name: Windows installer and portable ZIP
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Mac Intel and Apple Silicon packages
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Packaged native Mac UI regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          PAID_SMOKE_OUTPUT: verification/ui-packaged
        run: |
          binary=$(find dist/mac-arm64 -path '*/Contents/MacOS/*' -type f -maxdepth 4 | head -n 1)
          "$binary" --paid-to-watch-smoke --disable-gpu --no-sandbox
      - name: Upload Mac packages to prepared draft
        if: runner.os == 'macOS' && inputs.upload_mac_draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$(gh release view "v$version" --json isDraft --jq '.isDraft')" = true
          gh release upload "v$version" dist/*.dmg dist/*mac*.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: paid-to-watch-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.yml
            verification/ui/*
            verification/ui-packaged/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ runner.os }}
          path: verification/ui*/*
