<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:"><meta name="viewport" content="width=device-width,initial-scale=1"><title>带薪看片 · 设置与反馈</title><link rel="stylesheet" href="controls.css"><script defer src="controls.js"></script></head><body>
<header><span class="eyebrow">带薪看片</span><h1>声音、更新与反馈</h1><p id="version"></p></header>
<section><h2>声音</h2><label class="toggle"><span>本地视频声音</span><input id="localSound" type="checkbox"></label><label class="toggle"><span>网页直播声音</span><input id="liveSound" type="checkbox"></label><p class="hint">首次使用默认静音。切到老板键广告模式会强制静音；切回后恢复你的声音偏好。</p><p id="playStatus" role="status"></p><small id="hotkey"></small></section>
<section><h2>软件更新</h2><p id="updateStatus">正在读取更新状态</p><progress id="progress" hidden max="100"></progress><p class="hint" id="updateHint"></p><div class="buttons"><button id="check">检查新版</button><button id="install" hidden>更新并重启</button><button class="secondary" id="release">发布页</button></div></section>
<section><h2>遇到问题反馈</h2><label>问题类型<select id="category"><option>播放或声音</option><option>网页直播</option><option>窗口或老板键</option><option>更新</option><option>其他</option></select></label><label>补充说明<textarea id="note" rows="3" maxlength="4000" placeholder="发生了什么、如何复现？"></textarea></label><label class="checkbox"><input id="includeLogs" type="checkbox" checked>附上技术日志摘要</label><p class="hint">日志不含视频路径、网页地址、媒体内容或登录信息。点击后复制内容并打开 GitHub，由你粘贴、确认后提交；提交的内容公开可见。</p><div class="buttons"><button id="feedback">复制并去 GitHub 反馈</button><button class="secondary" id="export">导出技术日志</button></div></section>
<footer>感谢使用。喜欢这个工具，可以在仓库点个 Star。</footer><p id="message" role="status" aria-live="polite"></p></body></html>
