<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob:; img-src 'self' data:; connect-src 'none'">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header class="card-header">
        <span class="brand-mark" aria-hidden="true">捞</span>
        <span id="ad-brand"></span>
        <span class="ad-label">广告</span>
        <button class="card-close" id="close-card" aria-label="关闭">×</button>
      </header>
      <div class="stage" id="stage">
        <div class="addr-bar" id="addr-bar" hidden>
          <input type="text" id="addr-input" placeholder="输入网址,回车跳转" />
          <button id="addr-go">前往</button>
        </div>
        <video id="video" muted></video>
        <div class="recommendation-cover" id="video-empty"></div>
        <div class="recommendation-cover" id="boss-overlay" hidden></div>
      </div>
      <footer class="card-footer">
        <div class="category" id="ad-category"></div>
        <div class="recommendation-title" id="ad-title"></div>
        <div class="recommendation-meta"><span class="recommendation-source" id="ad-subtitle"></span><button id="open-catalog" class="catalog-link">了解更多 ›</button></div>
      </footer>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
